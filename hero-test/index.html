<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero — prova camera su immagine unica</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="../assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Il foglio vero del sito: i titoli e le CTA devono essere quelli,
         non una loro imitazione. Da qui arrivano .ch-title e .ch-cta -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="hero-test.css" />
  </head>
  <body class="ht-corpo">
    <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
      <symbol id="ico-wa" viewBox="0 0 24 24">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </symbol>
      <symbol id="ico-arr" viewBox="0 0 24 24">
        <path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </svg>

    <!-- Il tratto di scroll. L'altezza la scrive lo script dalla somma di
         soste e transizioni: cambiando le durate nel pannello cambia la
         lunghezza della pagina, se no si tarerebbero i tempi contro un
         binario di lunghezza sbagliata -->
    <div id="ht-scroller">
      <div id="ht-sticky">
        <div id="ht-camera">
          <img id="ht-foto" src="../assets/hero-pano.jpg" alt="" />
        </div>
        <div id="ht-velo"></div>

        <!-- Le quattro CTA: sono quelle del sito, testo per testo -->
        <div class="ht-ch" data-stop="0">
          <p class="ht-occhiello">Dal mare</p>
          <h1 class="ch-title">Un mare<br />di qualità</h1>
        </div>
        <div class="ht-ch" data-stop="1">
          <p class="ht-occhiello">Selezione</p>
          <h2 class="ch-title">Un solo fornitore<br />Tutto il pesce che ti serve</h2>
          <a href="#prodotti" class="ch-cta">Scopri i prodotti<svg class="arr" aria-hidden="true"><use href="#ico-arr"/></svg></a>
        </div>
        <div class="ht-ch" data-stop="2">
          <p class="ht-occhiello">Catena del freddo</p>
          <h2 class="ch-title">Ordina fino alle 2 di notte<br />Ricevi entro le 11 di mattina</h2>
          <a href="#processo" class="ch-cta">Come lavoriamo<svg class="arr" aria-hidden="true"><use href="#ico-arr"/></svg></a>
        </div>
        <div class="ht-ch" data-stop="3">
          <p class="ht-occhiello">Consegna</p>
          <h2 class="ch-title">Sali a bordo</h2>
          <a
            href="https://wa.me/393664142330?text=Ciao%20DelMar%2C%20vorrei%20informazioni%20per%20un%20primo%20ordine"
            target="_blank" rel="noopener noreferrer" class="ch-cta wa"
          >
            <svg width="16" height="16" fill="currentColor" aria-hidden="true"><use href="#ico-wa"/></svg>
            Scrivici su WhatsApp
          </a>
        </div>

        <!-- Indicatore delle soste, in basso: si vede a colpo d'occhio
             a che punto del percorso siamo -->
        <div id="ht-tacche"></div>
      </div>
    </div>

    <!-- Pannello di taratura. Non fa parte di niente: serve solo a
         trovare i numeri giusti e poi a copiarli.
         Chiuso all'apertura, perché questo indirizzo si manda anche a
         chi deve solo GUARDARE l'hero: si riapre col pulsantino in
         alto a destra, col tasto P, o aprendo la pagina con #taratura -->
    <div id="ht-pannello" hidden>
      <div class="ht-testa">
        <span>Taratura</span>
        <button type="button" id="ht-chiudi" aria-label="Nascondi pannello">—</button>
      </div>
      <div class="ht-corpo-pannello" id="ht-comandi"></div>
      <div class="ht-piede">
        <button type="button" id="ht-copia">Copia configurazione</button>
        <button type="button" id="ht-reset">Ripristina</button>
      </div>
      <p class="ht-nota" id="ht-nota"></p>
    </div>
    <button type="button" id="ht-apri" hidden>Taratura</button>

    <script src="hero-test.js"></script>
  </body>
</html>
